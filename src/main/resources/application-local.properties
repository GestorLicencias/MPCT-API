spring.application.name=MPCT

# Override DB Configuration to point to Local Docker (on port 5434)
spring.datasource.url=jdbc:postgresql://localhost:5434/mpct_db
spring.datasource.username=postgres
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for local env
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dummy Secrets for local testing
jwt.secret=TG9jYWxEdW1teUp3dFNlY3JldEtleVdoaWNoTmVlZHNUb0JlTG9uZ0Vub3VnaEZvckhTMjU2
mercadopago.access.token=TEST-dummy-mp-access-token
mercadopago.public.key=TEST-dummy-mp-public-key

# Propiedades de email correctas
spring.mail.username=dummy@example.com
spring.mail.password=dummy

# JSON.pe API Key
json.pe.api-key=${JSON_PE_API_KEY:mock_key}
